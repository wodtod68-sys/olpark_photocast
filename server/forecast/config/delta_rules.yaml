# 노출 변화 규칙 — ★ 보정 전 (상식선 초기값). 검증 로그(validation_log.csv)가 쌓이면 맞춰 고친다.
#
# 원본 대비 변화 = 목표 상태값 − 기준 상태값.
# 상태값 = 빛 단계 기본값 + 방향 효과 × 직사광 가중 + 직사광 효과 + 연무 효과
#   ev: 노출(stop), contrast/saturation/warmth: 상대 척도(−3~+3 정도)
# 1) overrides에 (기준 단계 → 목표 단계, 방향 변화, 직사광 변화) 조합이 있으면 그 문장을 그대로 쓴다.
# 2) 없으면 아래 계수로 계산한 변화량을 templates.yaml의 구간 문장으로 바꾼다.
version: "d1.0"   # 모델 v1 확정 (2026-11-25). 11/22 실제 사진으로 박명·그늘 보정

# L1~L3 ev는 폰 자동 노출 때문에 작게 잡는다 (11/22 실제 사진: 해 지기 직전에도 밝기 거의 그대로)
light_stage:
  L0: {ev: -6.0, contrast: -2.5, saturation: -3.0, warmth: -1.0}
  L1: {ev: -0.7, contrast: -1.5, saturation: -1.0, warmth: -1.0}   # 11/22 장미광장 17:35(−4.2°) 실측: 지면 밝기 기준 사진과 같음, 채도 조금↓
  L2: {ev: -0.3, contrast: -0.5, saturation: 0.5,  warmth: 2.5}
  L3: {ev: -0.2, contrast: 0.2,  saturation: 0.5,  warmth: 1.2}
  L4: {ev: -0.3, contrast: 0.0,  saturation: 0.0,  warmth: 0.3}
  L5: {ev: 0.0,  contrast: 0.0,  saturation: 0.0,  warmth: 0.0}

# 방향 효과: 앞뒤 성분 f = cos(rel) (+1 = 해가 정면 = 역광) 1당 변화.
# 카메라를 향한 면이 그늘로 들어가면 어둡고 납작하고 탈색된다.
direction_per_forward:
  ev: -1.8
  contrast: -2.0
  saturation: -1.0
  warmth: 0.0
# 직사광 단계별 방향 효과 가중 (구름이 많으면 방향 효과가 사라진다)
direction_weight_by_direct: {D3: 1.0, D2: 0.7, D1: 0.35, D0: 0.0}

direct_sun:
  D3: {ev: 0.0,  contrast: 0.0,  saturation: 0.0,  warmth: 0.0}
  D2: {ev: -0.3, contrast: -0.5, saturation: -0.3, warmth: -0.2}
  D1: {ev: -0.7, contrast: -1.2, saturation: -0.8, warmth: -0.4}
  D0: {ev: -1.0, contrast: -2.0, saturation: -1.5, warmth: -0.6}

# 연무 단계 1당
haze_per_stage: {ev: 0.0, contrast: -0.5, saturation: -0.5, warmth: 0.0}

# 강수 중이면 추가
precip: {ev: -0.5, contrast: -0.5, saturation: -0.5, warmth: -0.3}

# 조합별 직접 문장 (선택). 키: "<기준L>-><목표L>|<기준방향>-><목표방향>|<기준D>-><목표D>"
# 와일드카드 *. 위에서부터 처음 맞는 것을 쓴다.
# 맑은 박명(해 진 뒤 0~−6°): 폰 자동 노출로 지면 밝기가 기준 사진과 거의 같다 (11/22 장미광장 17:35 −4.2° 실측: 지면 L 58→61, 채도 18→14)
# 기준 사진의 빛 방향(순광이라 밝음 등)과 상관없이 같은 문장. 흐린 박명은 계수로 계산.
overrides:
  # 밤(해 −6° 아래): 폰 야간 모드가 밝혀서 새까맣지 않다. ★ 실측 전 추정 (#39: 7스톱 문장 → 지면 밝기가 박명 실측의 절반)
  - key: "*->L0|*|*"
    text: "Overall exposure: darker than the original but not pitch black, because the phone's night mode brightens the scene: about two to three stops darker overall, with the sky and far background darker than the foreground; lower contrast, much less saturated colors."
  - key: "*->L1|*|*->D3"
    text: "Overall exposure: about half a stop darker than the original, because the phone camera brightens the dim scene automatically; lower contrast, slightly less saturated colors, cool bluish ambient light."
  - key: "*->L1|*|*->D2"
    text: "Overall exposure: about half a stop darker than the original, because the phone camera brightens the dim scene automatically; lower contrast, slightly less saturated colors, cool bluish ambient light."
#  - key: "L5->L2|*|D3->D3"
#    text: "Overall exposure: about two stops darker than the original, warm golden light, ..."

# 해가 장애물(숲·건물) 뒤로 넘어가 촬영 지점이 그늘일 때 (2026-11-23 #4·#5 실험에서 추가).
# 해 고도만 보고 "황금빛·채도 상승"을 넣던 것을 막는다: 방향 효과 없음, 조금 어둡고 차분하게.
spot_shaded:
  direction_weight: 0.0
  ev: 0.0          # 실제 11/22 16:57·16:58: 밝기·대비는 기준 사진과 비슷했다(폰 자동 노출)
  contrast: 0.0
  saturation: -1.2 # 실제: 채도 10.0→5.5 (나홀로나무)
  warmth: -2.0     # 실제: 잔디 b* 8.9→3.4 (덜 노랗게)
