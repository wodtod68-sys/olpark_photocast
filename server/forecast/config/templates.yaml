# 프롬프트 문장 템플릿. 코드에는 문장을 두지 않는다 — 여기만 고쳐 가며 고도화한다.
# version은 meta.json·validation_log.csv에 같이 기록된다. 문장을 바꾸면 version도 올릴 것.
# 기본 톤: 실제 웹캠 정답 대비 지면 ΔE를 16.6 → 8.0으로 줄인 참고 프롬프트 (21510, 14:47 → 16:02).
version: "v1.0"   # 모델 v1 확정 (2026-11-25, 검증 세트 72장)

# 블록 순서. 참고 프롬프트처럼 "Edit this photo to show …"(시간 변화)로 시작한다.
# lighting 블록은 우선순위 규칙(강수 > 안개 > 흐림 > 밤 > 태양 방향)에 따라 하나만 고른다.
order: [time_change, preserve, lighting, lamps, consequences, exposure, sky_air, trees, ground, no_beautify]

# ---------------- 2) 시간 변화 ----------------
time_change:
  later: "Edit this photo to show the same scene {amount} later{pod}."
  earlier: "Edit this photo to show the same scene {amount} earlier{pod}."
  same_time: "Edit this photo to show the same scene at the same time of day under the conditions described below."
  other_day: "Edit this photo to show the same scene on a different day, at about {clock}{pod}."
  max_hours_relative: 18          # 이보다 차이가 크면 other_day 문장
amount:
  minutes: "about {m} minutes"
  one_hour: "about one hour"
  hours: "about {h} hours"
part_of_day:                       # 목표 현지 시각 [시작시, 끝시)
  - {from: 4,  to: 11, text: " in the morning", word: morning}
  - {from: 11, to: 13, text: " around midday", word: midday}
  - {from: 13, to: 17, text: " in the afternoon", word: afternoon}
  - {from: 17, to: 20, text: " in the early evening", word: evening}
  - {from: 20, to: 28, text: " at night", word: night}

# ---------------- 1) 보존 ----------------
preserve: "This is an edit of the original photo, not a new photo: keep the exact same camera position, zoom and framing, so every object stays at the same place and size in the frame. Keep the exact composition, camera angle, framing, {subjects}all buildings, streets, trees and people unchanged in position and shape. Keep all text, timestamps and logos exactly as they are. Do not add any new buildings, skyline, towers, people or objects that are not in the original; the horizon line must stay exactly as it is. Wherever the original shows open sky, keep it open sky: do not add mountains, hills, ridges, distant landscape or buildings behind the subjects, even when the air is hazy or the sky is grey."

# ---------------- 3) 태양 기하 / 우선순위 블록 ----------------
lighting:
  sun: "Sun position: about {elev} degrees above the horizon, {where}, {frame}. In the original it was {base_cmp}."
  rain: "Weather: it is raining{intensity}. The light is soft and grey with no shadows."
  snow: "Weather: it is snowing{intensity}. The light is soft and white-grey with no shadows."
  fog: "Weather: dense fog; distant buildings fade into a flat white-grey, nearby objects lose contrast, and there are no shadows."
  overcast: "Lighting: the sun is hidden behind thick clouds; the light is soft and even, with no direct sunlight and no distinct shadows."
  twilight: "Lighting: the sun is just below the horizon; soft, even, cool twilight light with no direct sunlight and no shadows. Do not add any new lights, lit windows or objects."
  night: "Lighting: it is night; there is no sunlight, and the scene is lit only by the lamps that already exist in the original photo."
# 조명: 해가 on_below_elev(rules.yaml, 기본 −1°)보다 낮을 때. {lamps} = 스팟 yaml의 lamps 묘사
lamps:
  lit: "Lamps: {lamps} are switched on{glow}. Light only these existing lamps; do not add any new lamps, lights or lit windows."
  glow:     # 스팟 yaml lamps.glow 로 고른다
    bright: " and glowing with bright white light"
    strong: ", and they glow brightly: each existing lamp is a strong, almost overexposed white spot with a soft halo, like LEDs seen by a phone camera, and it brightly lights the ground right around it. Keep the number and positions of the lamps exactly as in the original"
    dim: ", but they are small and dim: just a few soft points of light with only a faint glow on the ground right around each lamp, and the rest of the scene is not lit by them"
  no_lamps: "There are no lamps in this scene; do not add any lights, lamps or lit windows."
precip_intensity:
  light:
    rain: " lightly: a fine drizzle that is barely visible in the air; surfaces are only damp, with no puddles, and distant objects stay almost as clear as in the original"
    snow: " lightly: a few small flakes in the air; distant objects stay almost as clear as in the original"
  moderate:
    rain: ": steady rain; faint rain streaks are visible against dark backgrounds, paths are wet and glossy with small puddles, and distant objects are slightly softened"
    snow: ": steady snowfall; flakes are visible in the air and distant objects are softened"
  heavy:
    rain: " heavily: dense rain streaks fill the air, puddles with splashes form on the paths and paved areas, and distant trees and buildings are clearly greyed out and blurred by the rain; the whole scene is noticeably darker and dimmer"
    snow: " heavily: dense falling snow fills the air and distant objects fade into white-grey"
where:
  ahead_left: "ahead of the camera and to the left"
  ahead: "almost straight ahead of the camera"
  ahead_right: "ahead of the camera and to the right"
  left: "to the left of the camera"
  right: "to the right of the camera"
  behind_left: "behind the camera and to the left"
  behind: "behind the camera"
  behind_right: "behind the camera and to the right"
frame: {in: "inside the frame", out: "outside the frame"}
base_cmp:
  below_horizon: "below the horizon"
  elev_higher: "higher"
  elev_lower: "lower"
  more_side_left: "more to the left side"
  more_side_right: "more to the right side"
  more_ahead: "more ahead of the camera"
  more_behind: "more behind the camera"
  similar_dir: "in a similar direction"
  joiner: " and "

# ---------------- 4) 결과 ----------------
consequences:
  text: "Consequences: {parts}."
  joiner: "; "
  camera_facing:
    shade: "the sides of {subjects_short} that face the camera are now mostly in shade and noticeably darker"
    lit: "the sides of {subjects_short} that face the camera are now in direct sunlight and brighter"
    grazing: "the sides of {subjects_short} that face the camera are lit at a grazing angle"
  side:
    ahead_left: "only surfaces facing left catch direct sunlight"
    ahead_right: "only surfaces facing right catch direct sunlight"
    left: "surfaces facing left are brightly lit while surfaces facing right are in shade"
    right: "surfaces facing right are brightly lit while surfaces facing left are in shade"
  shadows: "shadows on {ground} are {length} and point {direction}"
  shadow_length:
    much_longer: "much longer (about {k} times)"
    longer: "longer"
    same: "about the same length"
    shorter: "shorter"
    much_shorter: "much shorter"
    thresholds: {much: 2.0, some: 1.25}
  shadow_direction:
    toward: "toward the camera"
    more_toward: "more toward the camera"
    away: "away from the camera"
    more_away: "more away from the camera"
    left: "to the left"
    right: "to the right"
  patchy: "shadows are softer and patchy as clouds pass over the sun"
  spot_shaded: "the sun has already dropped behind distant trees and buildings, so the whole scene is in soft, even shade: no direct sunlight, no golden light on the ground or on the trees, and no long shadows"

# ---------------- 5) 노출 변화 (delta_rules.yaml 수치 → 문장) ----------------
exposure:
  text: "Overall exposure: {ev}, {contrast}, {saturation}{warmth}."
  ev:          # |Δev| 상한, 어두워질 때, 밝아질 때
    - [0.2, "about the same brightness as the original", "about the same brightness as the original"]
    - [0.45, "slightly darker than the original", "slightly brighter than the original"]
    - [0.75, "about half a stop darker than the original", "about half a stop brighter than the original"]
    - [1.3, "about one stop darker than the original", "about one stop brighter than the original"]
    - [1.8, "about one and a half stops darker than the original", "about one and a half stops brighter than the original"]
    - [2.6, "about two stops darker than the original", "about two stops brighter than the original"]
    - [99, "much darker than the original, about {n} stops", "much brighter than the original, about {n} stops"]
  contrast:
    - [0.25, "similar contrast", "similar contrast"]
    - [1.5, "lower contrast", "higher contrast"]
    - [99, "much lower contrast", "much higher contrast"]
  saturation:
    - [0.25, "similar color saturation", "similar color saturation"]
    - [1.5, "less saturated colors", "more saturated colors"]
    - [99, "much less saturated, muted colors", "much more saturated colors"]
  warmth:      # 음수 = 차가워짐, 양수 = 따뜻해짐 (앞쪽이 차가움, 뒤쪽이 따뜻함)
    - [0.4, "", ""]
    - [1.5, ", slightly cooler light", ", slightly warmer light"]
    - [99, ", cool bluish light", ", warm golden light"]

# ---------------- 6~7) 하늘·대기·랜드마크 ----------------
sky_air: "Sky and air: {sky}; {air}."
sky:
  clear: "clear blue sky"
  clear_toward_sun: "paler, hazier blue-grey sky"
  high: "thin high clouds veiling a pale sky"
  low_many: "many low grey clouds"
  overcast: "a uniform grey overcast sky"
  partly: "scattered clouds in a blue sky"
  golden: "pale light-blue sky, slightly whiter and brighter near the horizon, with at most a faint warm tint"
  hazy: "a pale, washed-out whitish-grey sky instead of blue"
  twilight: "pale blue twilight sky, fading to a faint soft peach-pink glow just above the horizon"
  night: "a dark night sky"
  rain: "dark grey rain clouds"
  fog: "a flat white-grey sky"
air:
  more: "more {pod_word} haze than in the original, distant details slightly softer"
  less: "clearer, slightly crisper air than in the original"
  same: "similar haze to the original"
  heavy: "much hazier than in the original: a thick grey-white haze of heavy fine dust; distant trees and buildings are faded, greyish and low in contrast, and the whole scene looks dull and milky"
  fog: "thick fog hides the distance"
landmark: "{name} {vis}"
landmark_vis:
  clear: "is clearly visible"
  soft: "is visible but softened by haze"
  faint: "is only faintly visible through haze"
  hidden: "is hidden by haze"

# ---------------- 8) 수목 ----------------
trees:
  text: "Trees: {items}."
  joiner: "; "
  change: "make the {species} show {target} instead of {base}"
  keep: "keep the {species} exactly as they are in the original ({target})"

# ---------------- 9) 지면 ----------------
ground:
  text: "Ground: {items}."
  joiner: "; "
  wet: "wet surfaces with reflections from recent rain"
  dry_from_wet: "dry surfaces with no rain reflections"
  snow: "the whole ground is covered by a thick, continuous layer of fresh white snow: the lawn, fields, beds, paths and rooftops are clearly white, with only trees, posts and objects sticking out of the snow"
  snow_thin: "a thin, patchy dusting of fresh snow: the ground and rooftops are lightly whitened, with grass, soil and path stones still showing through in many places"
  snow_gone: "no snow on the ground"
  frost: "light white frost on grass and roofs"
  leaves: "fallen leaves scattered on the ground"

# ---------------- 10) 미화 금지 ----------------
no_beautify: "Do not enhance, beautify or add drama. Keep the dull, slightly washed-out look of a real {scene_kind}."
